name: YouTube Shorts Auto Upload

on:
  schedule:
    # 8:00 AM IST
    - cron: "30 2 * * *"
    # 2:00 PM IST
    - cron: "30 8 * * *"
    # 4:30 PM IST
    - cron: "0 11 * * *"
    # 9:00 PM IST
    - cron: "30 15 * * *"

  workflow_dispatch: # manual trigger (optional)

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🎲 Random human-like delay (2–10 minutes)
        run: |
          DELAY=$((120 + RANDOM % 480))
          echo "Sleeping for $DELAY seconds..."
          sleep $DELAY

      - name: 🚀 Run uploader
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          APPLICATION_NAME: ${{ secrets.APPLICATION_NAME }}

          CONTENT_FOLDER_ID: ${{ secrets.CONTENT_FOLDER_ID }}
          PROCESSED_FOLDER_ID: ${{ secrets.PROCESSED_FOLDER_ID }}

          AUDIO_FOLDER_ID: ${{ secrets.AUDIO_FOLDER_ID }}
          QUOTE_FOLDER_ID: ${{ secrets.QUOTE_FOLDER_ID }}

        run: |
          ./mvnw -q clean package
          java -jar target/yt-upload-0.0.1-SNAPSHOT.jar
