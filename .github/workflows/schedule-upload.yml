name: YouTube Shorts Auto Upload

on:
  schedule:
    # 8:00 AM IST → 02:30 UTC
    #- cron: "30 2 * * *"

    # 2:00 PM IST → 08:30 UTC
    #- cron: "30 8 * * *"

    # 4:30 PM IST → 11:00 UTC
    #- cron: "0 11 * * *"

    # 9:00 PM IST → 15:30 UTC
    #- cron: "30 15 * * *"

  workflow_dispatch: # manual trigger for testing

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧹 Free disk space (critical)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: 🧹 Clean workspace
        run: |
          rm -rf downloads audios tmp output || true
          df -h

      - name: Prepare folders
        run: |
          mkdir -p tmp
          mkdir -p output
          mkdir -p downloads
          mkdir -p audios
    

      - name: 🎥 Install FFmpeg
        run: |
            sudo apt-get update
            sudo apt-get install -y ffmpeg    

      - name: 🔓 Make mvnw executable
        run: chmod +x mvnw

      # ================================
      # ❌ RANDOM DELAY (COMMENTED FOR TESTING)
      # ================================
      - name: 🎲 Random human-like delay (2–10 minutes)
        run: |
           DELAY=$((120 + RANDOM % 480))
           echo "Sleeping for $DELAY seconds..."
           sleep $DELAY

      - name: 🛠 Build project
        run: ./mvnw -q clean package

      - name: 🔍 Debug paths
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
          ls -la tmp || true
          ls -la output || true      

      - name: 🚀 Run uploader
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          APPLICATION_NAME: ${{ secrets.APPLICATION_NAME }}

          CONTENT_FOLDER_ID: ${{ secrets.CONTENT_FOLDER_ID }}
          POSTED_FOLDER_ID: ${{ secrets.POSTED_FOLDER_ID }}

          AUDIO_FOLDER_ID: ${{ secrets.AUDIO_FOLDER_ID }}
          QUOTE_FOLDER_ID: ${{ secrets.QUOTE_FOLDER_ID }}

          VIDEO_TITLE: ${{ secrets.VIDEO_TITLE }}
          VIDEO_DESC: ${{ secrets.VIDEO_DESC }}
          VIDEO_TAGS: ${{ secrets.VIDEO_TAGS }}
          STATE_FOLDER_ID: ${{ secrets.STATE_FOLDER_ID }}


        run: |
          mkdir -p tmp
          java -Djava.io.tmpdir=$GITHUB_WORKSPACE/tmp \
               -jar target/yt-upload-0.0.1-SNAPSHOT.jar
