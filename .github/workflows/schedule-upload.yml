name: Scheduled Drive->YouTube Upload

#on:
#  schedule:
    # 08:00 AM IST → 02:30 AM UTC
#    - cron: '30 2 * * *'
    # 12:30 PM IST → 07:00 AM UTC
#    - cron: '0 7 * * *'
    # 04:30 PM IST → 11:00 AM UTC
#    - cron: '0 11 * * *'
    # 08:30 PM IST → 03:00 PM UTC
#    - cron: '0 15 * * *'
#  workflow_dispatch:   # allows manual trigger

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build project
        run: ./mvnw clean package --batch-mode

      - name: Run Drive->YouTube uploader
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CONTENT_FOLDER_ID: ${{ secrets.CONTENT_FOLDER_ID }}
          POSTED_FOLDER_ID: ${{ secrets.POSTED_FOLDER_ID }}
          APPLICATION_NAME: "YtUploadApplication-AviTech"
          VIDEO_TITLE: "Facts That Will Make You Question Everything 😳| @Factvibes19"
          VIDEO_DESC: "Welcome to FactsVibe, where every second comes with a mind-blowing fact you never knew you needed!
                      Today’s video is packed with weird, shocking, funny, and unbelievable facts that will keep you hooked till the very end.

                      🔥 Don’t skip — the last fact will blow your mind!
                      🔥 Comment “FACTS!” if you want a Part 2.
                      🔥 Subscribe for daily viral facts!
                      
                      What’s inside this video?
                      ✔ Facts that sound fake but are true
                      ✔ Crazy science & psychology facts
                      ✔ Funny facts to make you laugh
                      ✔ Weird real-life facts you’ve never heard before
                      ✔ Quick knowledge boosters for your day
                      
                      Stay curious. Stay vibing. Stay FACTS! ⚡
                      #FactsVibe"
          VIDEO_TAGS: "viral facts, trending facts, mind blowing facts, crazy facts, unbelievable facts, wow facts, facts shorts, YouTube shorts facts, viral shorts, trending shorts, random facts, fun facts, interesting facts, hook facts, amazing facts, shocking facts, weird facts, viral videos 2025, top facts, fact vlog, fact channel, daily facts, knowledge shorts, surprising facts, fast facts, unknown facts, funny facts, hilarious facts, crazy funny facts, fun shorts, comedy facts, weird funny facts, facts that make you laugh, silly facts, unbelievable funny facts, joke facts, fun vibe, entertaining facts, funny trivia, random funny facts, viral funny shorts, laugh facts, humor shorts, strange funny facts, funny wow facts, psychology facts, science facts, brain facts, mind tricks, human behavior facts, smart facts, genius facts, knowledge facts, educational facts, learning shorts, real science facts, shocking brain facts, school facts, unbelievable psychology facts, human mind facts, thinking facts, intelligence facts, science shorts, neuroscience facts, psychological truth, fact learning"
        run: java -jar target/yt-upload-0.0.1-SNAPSHOT.jar

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploader-logs
          path: logs/uploader.log