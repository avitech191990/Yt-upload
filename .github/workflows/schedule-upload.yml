name: Scheduled Drive->YouTube Upload

on:
  schedule:
    # 08:00 AM IST → 02:30 AM UTC
    - cron: '30 2 * * *'
    # 12:30 PM IST → 07:00 AM UTC
    - cron: '0 7 * * *'
    # 04:30 PM IST → 11:00 AM UTC
    - cron: '0 11 * * *'
    # 08:30 PM IST → 03:00 PM UTC
    - cron: '0 15 * * *'
  workflow_dispatch:   # allows manual trigger

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build project
        run: ./mvnw clean package --batch-mode

      - name: Run Drive->YouTube uploader
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CONTENT_FOLDER_ID: ${{ secrets.CONTENT_FOLDER_ID }}
          POSTED_FOLDER_ID: ${{ secrets.POSTED_FOLDER_ID }}
          APPLICATION_NAME: "YtUploadApplication-AviTech"
          VIDEO_TITLE: "Facts That Will Make You Question Everything 😳| @Factvibes19"
          VIDEO_DESC: "Welcome to FactsVibe, where every second comes with a mind-blowing fact you never knew you needed!
                      Today’s video is packed with weird, shocking, funny, and unbelievable facts that will keep you hooked till the very end.

                      🔥 Don’t skip — the last fact will blow your mind!
                      🔥 Comment “FACTS!” if you want a Part 2.
                      🔥 Subscribe for daily viral facts!
                      
                      What’s inside this video?
                      ✔ Facts that sound fake but are true
                      ✔ Crazy science & psychology facts
                      ✔ Funny facts to make you laugh
                      ✔ Weird real-life facts you’ve never heard before
                      ✔ Quick knowledge boosters for your day
                      
                      Stay curious. Stay vibing. Stay FACTS! ⚡
                      #FactsVibe"
          VIDEO_TAGS: "facts, interesting facts, amazing facts, unbelievable facts, mind blowing facts, shocking facts, fact shorts"
        run: java -jar target/yt-upload-0.0.1-SNAPSHOT.jar

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploader-logs
          path: logs/uploader.log